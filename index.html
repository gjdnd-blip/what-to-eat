<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘 뭐 먹지?</title>
  <meta name="description" content="지금 기분과 상황을 적으면 메뉴를 골라 주는 음식 추천 사이트">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:url" content="https://what-to-eat-sigma-nine.vercel.app/">
  <meta property="og:title" content="오늘 뭐 먹지?">
  <meta property="og:description" content="지금 기분과 상황을 적으면 메뉴를 골라 드려요. 83가지 메뉴 중 랜덤 추천!">
  <meta property="og:image" content="https://what-to-eat-sigma-nine.vercel.app/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#fff3d6">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%BD%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 배경에 둥둥 떠다니는 음식들 (장식용) -->
  <div class="floaters" aria-hidden="true">
    <span>🍕</span><span>🍜</span><span>🍗</span><span>🍣</span>
    <span>🥘</span><span>🍔</span><span>🥟</span><span>🍛</span>
  </div>

  <main class="card">
    <button type="button" id="musicBtn" class="sound-btn music-btn" aria-pressed="false" aria-label="배경음악 켜기/끄기" title="배경음악 켜기">🎵</button>
    <button type="button" id="soundBtn" class="sound-btn" aria-pressed="true" aria-label="소리 켜기/끄기" title="소리 끄기">🔊</button>
    <header class="hero">
      <div class="hero-emoji" aria-hidden="true">🍽️</div>
      <h1>오늘 <span class="mark">뭐 먹지?</span></h1>
      <p class="sub">지금 기분이나 상황을 적으면<br>메뉴를 콕 집어 드려요</p>
    </header>

    <label for="input" class="sr-only">먹고 싶은 음식이나 상황</label>
    <textarea id="input" rows="3" spellcheck="false"
      placeholder="예: 비 오는데 따뜻하고 매콤한 게 먹고 싶어. 혼자야."></textarea>
    <p id="msg" class="msg" role="alert" hidden></p>

    <div class="examples" role="group" aria-label="예시 문장">
      <button type="button" class="example" data-text="비 오는 날 따뜻한 국물">☔ 비 오는 날</button>
      <button type="button" class="example" data-text="혼자 간단하게 먹고 싶어">🙋 혼밥</button>
      <button type="button" class="example" data-text="친구랑 술 한잔 할 건데 바삭한 거">🍻 친구랑 한잔</button>
      <button type="button" class="example" data-text="스트레스 받아서 매운 거 먹고 싶어">😤 스트레스</button>
      <button type="button" class="example" data-text="더운데 시원하고 가벼운 거">🥵 더운 날</button>
    </div>

    <div class="price" role="group" aria-labelledby="priceLabel">
      <p class="price-label" id="priceLabel">💰 가격대 <small>(대략적인 가격이에요. 가게마다 달라요)</small></p>
      <div class="price-row">
        <button type="button" class="price-opt" aria-pressed="true"  data-price="0">상관없음</button>
        <button type="button" class="price-opt" aria-pressed="false" data-price="1">💸 1만원 이하</button>
        <button type="button" class="price-opt" aria-pressed="false" data-price="2">💵 1~2만원</button>
        <button type="button" class="price-opt" aria-pressed="false" data-price="3">💎 2만원 이상</button>
      </div>
    </div>

    <button type="button" id="btn">추천받기</button>

    <div id="result" class="result hidden" aria-live="polite"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
