<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>테스트 · 오늘 뭐 먹지?</title>
  <style>
    body { font-family: "Malgun Gothic", sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; line-height: 1.6; }
    h1 { font-size: 22px; }
    .summary { padding: 12px 16px; border-radius: 8px; font-weight: bold; }
    .summary.good { background: #d3f9d8; }
    .summary.bad { background: #ffe3e3; }
    ul { padding-left: 0; list-style: none; }
    li { padding: 4px 0; border-bottom: 1px solid #eee; }
    small { color: #666; }
    iframe { position: absolute; width: 400px; height: 600px; left: -9999px; }
  </style>
</head>
<body>
  <h1>🧪 자동 테스트</h1>
  <p>사이트(<code>index.html</code>)를 몰래 열어 놓고, 추천 로직이 제대로 동작하는지 확인해요.
     <br><small>※ 주소창에 <code>http</code>로 시작하는 주소(배포된 사이트의 /tests.html)로 열어야 해요. 파일을 더블클릭하면 브라우저가 막을 수 있어요.</small></p>
  <div id="summary" class="summary">실행 중…</div>
  <ul id="list"></ul>
  <iframe id="app" src="index.html" title="테스트 대상"></iframe>

  <script>
    const frame = document.getElementById("app");
    const list = document.getElementById("list");
    const summary = document.getElementById("summary");
    let pass = 0, fail = 0;

    function check(name, cond, detail) {
      cond ? pass++ : fail++;
      const li = document.createElement("li");
      li.textContent = (cond ? "✅ " : "❌ ") + name;
      if (detail) { const s = document.createElement("small"); s.textContent = "  → " + detail; li.append(s); }
      list.append(li);
    }

    frame.addEventListener("load", () => {
      try {
        const w = frame.contentWindow;
        const run = (code) => w.eval(code); // 사이트 안의 변수·함수를 꺼내 쓰기 위해 사용

        // 데이터
        check("메뉴가 80개 이상 있다", run("menus.length") >= 80, run("menus.length") + "개");
        check("모든 메뉴에 가격대(1~3)가 있다", run("menus.every(m => [1,2,3].includes(m.price))"));
        check("모든 메뉴에 태그가 있다", run("menus.every(m => m.tags.length > 0)"));

        // 단어 인식
        check("'회사에서'를 해산물(회)로 착각하지 않는다", !run('analyze("회사에서 힘들었어").wanted["해산물"]'));
        check("'면접'을 면 요리로 착각하지 않는다", !run('analyze("면접 끝났어").wanted["면"]'));
        check("'매운 거 말고'는 매운맛을 피한다", run('analyze("매운 거 말고 담백한 거").avoid.has("매운")'));
        check("'한식 안 먹어본 지 오래돼서 한식 먹고 싶어'는 한식을 원한다",
          run('analyze("한식 안 먹어본 지 오래돼서 한식 먹고 싶어").wanted["한식"] > 0'));
        check("영어(spicy)도 알아듣는다", run('analyze("spicy").wanted["매운"] > 0'));
        check("별칭: '돈가스'를 쓰면 돈카츠가 1위", run(`
          (() => { const t = "돈가스"; const a = analyze(t);
            return menus.map(m => ({ n: m.name, s: score(m, t, a.wanted, a.avoid) })).sort((x, y) => y.s - x.s)[0].n.includes("돈카츠"); })()
        `));

        // 추천 결과
        check("'삼겹살 말고'라고 하면 100번 중 삼겹살이 한 번도 안 나온다", run(`
          (() => { for (let i = 0; i < 100; i++) if (recommend("삼겹살 말고 고기", new Set()).pick.name.includes("삼겹살")) return false; return true; })()
        `));
        check("가격대(1만원 이하)를 고르면 그 범위만 추천한다", run(`
          (() => { currentPrice = 1; let ok = true;
            for (let i = 0; i < 100; i++) { const r = recommend("국물", new Set()); if (r.pick.price !== 1 || r.extras.some(e => e.price !== 1)) ok = false; }
            currentPrice = 0; return ok; })()
        `));
        check("후보가 적은 가격대에서 20번 연달아 눌러도 오류가 없다", run(`
          (() => { currentPrice = 1; const sk = new Set(); try { for (let i = 0; i < 20; i++) sk.add(recommend("국물", sk).pick); } catch (e) { currentPrice = 0; return false; } currentPrice = 0; return true; })()
        `));

        summary.textContent = fail === 0 ? `🎉 전부 통과! (${pass}개)` : `⚠️ ${fail}개 실패 / ${pass}개 통과`;
        summary.className = "summary " + (fail === 0 ? "good" : "bad");
      } catch (e) {
        summary.textContent = "⚠️ 테스트를 실행하지 못했어요: " + e.message;
        summary.className = "summary bad";
      }
    });
  </script>
</body>
</html>
